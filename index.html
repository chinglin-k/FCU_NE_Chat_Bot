<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com https://generativelanguage.googleapis.com https://www.google.com; img-src 'self' data:; frame-src https://www.google.com; object-src 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逢甲大學福星宿舍網路報修助理 | FCU Fuxing Dormitory Network Repair Assistant</title>
  <meta name="description" content="逢甲大學福星宿舍網路報修 Chatbot，提供網路教學、常見問題解答，以及線上報修申請服務。FCU Fuxing Dormitory Network Repair Chatbot — offering network tutorials, FAQ, and online repair submission.">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
<script src="https://www.google.com/recaptcha/api.js?render=6LehknstAAAAAPmlQlfjbI5nnbLY2fBrnmkXOcqI" async defer></script>
</head>
<body>
  <div id="app">

    <!-- ── Header ── -->
    <header class="chat-header" role="banner">
      <div class="header-logo">
        <div class="logo-icon" aria-hidden="true">🔧</div>
        <div class="header-text">
          <h1 class="header-title" data-i18n="header.title">逢甲福星宿舍網路報修助理</h1>
          <p class="header-subtitle" data-i18n="header.subtitle">FCU Fuxing Dormitory Network Support</p>
        </div>
      </div>
      <div class="header-right">
        <div class="header-counter" data-i18n-aria-label="header.counter.aria" aria-label="累積服務人數">
          <span class="counter-label counter-label-prefix" data-i18n="header.counter.prefix">已協助</span>
          <span class="counter-value" id="counter-display">---</span>
          <span class="counter-label counter-label-suffix" data-i18n="header.counter.suffix">人</span>
          <span class="counter-star" aria-hidden="true">✨</span>
        </div>
        <!-- ── Teams 常駐連結 ── -->
        <button
          id="teams-header-btn"
          class="header-teams-link"
          data-i18n-aria-label="teams.aria"
          aria-label="使用 Teams 聯絡網管（福星宿舍網路報修平台）"
          data-i18n-title="teams.title"
          title="使用 Microsoft Teams 聯絡福星宿舍網路報修平台"
        >
          <!-- Microsoft Teams 2025 icon：兩人形 + 左下角白T藍紫方塊 -->
          <svg class="teams-svg-icon" viewBox="0 0 40 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="tg-a" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#7B83EB"/>
                <stop offset="100%" stop-color="#4B53BC"/>
              </linearGradient>
              <linearGradient id="tg-b" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#9EA5F1"/>
                <stop offset="100%" stop-color="#6264A7"/>
              </linearGradient>
            </defs>
            <!-- 右側小人（頭） -->
            <circle cx="30" cy="7" r="5" fill="url(#tg-b)" opacity="0.9"/>
            <!-- 右側小人（身體） -->
            <path d="M22 20c0-5 3.6-9 8-9s8 4 8 9v2H22v-2z" fill="url(#tg-b)" opacity="0.85"/>
            <!-- 左側大人（頭） -->
            <circle cx="17" cy="8" r="7" fill="url(#tg-a)"/>
            <!-- 左側大人（身體） -->
            <path d="M3 28c0-7.7 6.3-14 14-14s14 6.3 14 28z" fill="url(#tg-a)"/>
            <!-- 左下角白T藍紫方塊 -->
            <rect x="0" y="18" width="18" height="18" rx="4" fill="url(#tg-a)"/>
            <!-- 白色 T 字 -->
            <path fill="white" d="M4 22h10v2.5H11v7H7v-7H4z"/>
          </svg>
          <span class="teams-link-text" id="teams-header-text" data-i18n="teams.button">聯絡我們</span>
        </button>
      </div>
    </header>

    <!-- ── Chat Messages Area ── -->
    <main class="chat-main" role="main">

  <!-- ── 語言切換懸浮按鈕 ── -->
  <button
    id="lang-toggle-btn"
    class="lang-toggle-btn"
    type="button"
    aria-pressed="false"
    data-i18n-aria-label="langToggle.aria"
    aria-label="切換語言為 English"
  >
    <span class="lang-toggle-label" aria-hidden="true">EN</span>
  </button>

      <div class="chat-messages" id="chat-messages" aria-live="polite" aria-label="對話訊息">
        <!-- 訊息由 JavaScript 動態插入 -->
      </div>
    </main>

    <!-- ── Report Form Modal ── -->
    <div class="modal-overlay" id="report-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <div class="modal-container">
        <div class="modal-header">
          <div>
            <h2 class="modal-title" id="modal-title" data-i18n="modal.title">🔧 報修通報</h2>
            <p class="modal-subtitle" data-i18n="modal.subtitle">請留下資料，系統將為您送出通報。</p>
          </div>
          <button class="modal-close" id="modal-close-btn" data-i18n-aria-label="modal.close.aria" aria-label="關閉報修表單">✕</button>
        </div>

        <form class="report-form" id="report-form" novalidate>
          <div class="form-group">
            <label for="field-name"><span data-i18n="form.name.label">姓名</span> <span class="required" data-i18n-aria-label="form.required.aria" aria-label="必填">*</span></label>
            <input type="text" id="field-name" name="name" data-i18n-placeholder="form.name.placeholder" placeholder="請輸入您的姓名" required autocomplete="name" maxlength="50">
          </div>

          <div class="form-group">
            <label for="field-student-id"><span data-i18n="form.studentId.label">學號</span> <span class="required" data-i18n-aria-label="form.required.aria" aria-label="必填">*</span></label>
            <input type="text" id="field-student-id" name="studentId" data-i18n-placeholder="form.studentId.placeholder" placeholder="例：D1234567" required maxlength="8" pattern="[A-Za-z][0-9]{7}">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="field-room"><span data-i18n="form.room.label">房號</span> <span class="required" data-i18n-aria-label="form.required.aria" aria-label="必填">*</span></label>
              <input type="text" id="field-room" name="roomNumber" placeholder="e.g. A123" required maxlength="8" pattern="[A-Za-z0-9-]{1,8}">
            </div>
            <div class="form-group">
              <label for="field-bed"><span data-i18n="form.bed.label">床號</span> <span class="required" data-i18n-aria-label="form.required.aria" aria-label="必填">*</span></label>
              <input type="text" id="field-bed" name="bedNumber" placeholder="e.g. 1" required maxlength="3" inputmode="numeric" pattern="[0-9]{1,3}">
            </div>
          </div>

          <div class="form-group">
            <label for="field-phone"><span data-i18n="form.phone.label">手機號碼</span> <span class="required" data-i18n-aria-label="form.required.aria" aria-label="必填">*</span></label>
            <input type="tel" id="field-phone" name="phone" placeholder="e.g. 0912345678" required autocomplete="tel" maxlength="10" inputmode="numeric" pattern="[0-9]{10}">
          </div>

          <div class="form-group">
            <label><span data-i18n="form.repairTime.label">可維修時間</span> <span class="required" data-i18n-aria-label="form.required.aria" aria-label="必填">*</span></label>
            <div class="repair-time-row" role="group" data-i18n-aria-label="form.repairTime.range" aria-label="可維修時間範圍">
              <input type="text" id="field-repair-hour-start" name="repairHourStart"
                placeholder="時" data-i18n-placeholder="form.repairTime.hour.placeholder" required inputmode="numeric" pattern="([0-9]|1[0-9]|2[0-3])"
                maxlength="2" data-i18n-aria-label="form.repairTime.startHour" aria-label="開始小時（0-23）" class="repair-time-input">
              <span class="repair-time-sep" aria-hidden="true" data-i18n="form.repairTime.hour.placeholder">時</span>
              <input type="text" id="field-repair-min-start" name="repairMinStart"
                placeholder="分" data-i18n-placeholder="form.repairTime.min.placeholder" required inputmode="numeric" pattern="([0-9]|[1-5][0-9])"
                maxlength="2" data-i18n-aria-label="form.repairTime.startMin" aria-label="開始分鐘（0-59）" class="repair-time-input">
              <span class="repair-time-sep" aria-hidden="true" data-i18n="form.repairTime.min.placeholder">分</span>
              <span class="repair-time-dash" aria-hidden="true" data-i18n="form.repairTime.sep">─</span>
              <input type="text" id="field-repair-hour-end" name="repairHourEnd"
                placeholder="時" data-i18n-placeholder="form.repairTime.hour.placeholder" required inputmode="numeric" pattern="([0-9]|1[0-9]|2[0-3])"
                maxlength="2" data-i18n-aria-label="form.repairTime.endHour" aria-label="結束小時（0-23）" class="repair-time-input">
              <span class="repair-time-sep" aria-hidden="true" data-i18n="form.repairTime.hour.placeholder">時</span>
              <input type="text" id="field-repair-min-end" name="repairMinEnd"
                placeholder="分" data-i18n-placeholder="form.repairTime.min.placeholder" required inputmode="numeric" pattern="([0-9]|[1-5][0-9])"
                maxlength="2" data-i18n-aria-label="form.repairTime.endMin" aria-label="結束分鐘（0-59）" class="repair-time-input">
              <span class="repair-time-sep" aria-hidden="true" data-i18n="form.repairTime.min.placeholder">分</span>
            </div>
            <p class="field-hint" id="repair-time-hint" data-i18n="form.repairTime.hint">
              ⏰ 可維修時間請填寫 <strong>18:00–21:00</strong> 之間（本人需在場）。新生入住期間 12:00–17:00 收到後會盡速前往協助。
            </p>
          </div>

          <div class="form-group">
            <label for="field-description"><span data-i18n="form.description.label">問題描述</span> <span class="required" data-i18n-aria-label="form.required.aria" aria-label="必填">*</span></label>
            <textarea
              id="field-description"
              name="description"
              data-i18n-placeholder="form.description.placeholder" placeholder="請詳細描述您遇到的網路問題，例如：網路連不上、IP 貼紙缺漏、網路孔故障等..."
              rows="4"
              required
              maxlength="200"
            ></textarea>
          </div>

          <div id="form-error-msg" class="form-error" role="alert" hidden></div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" id="form-cancel-btn" data-i18n="form.cancel">取消</button>
            <button type="submit" class="btn-primary" id="form-submit-btn">
              <span class="btn-text" data-i18n="form.submit">送出報修</span>
              <span class="btn-loading" hidden>
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
              </span>
            </button>
          </div>
        </form>

        <!-- ── 送出成功畫面（送出後顯示，取代表單）── -->
        <div id="modal-success-view" class="modal-success-view is-hidden">
          <div class="success-icon-wrap" aria-hidden="true">✅</div>
          <h3 class="success-title" data-i18n="success.title">報修成功！</h3>
          <p class="success-desc" data-i18n="success.desc">感謝您的回報，<br>網管人員收到後會盡快與您聯絡。</p>
          <div class="success-bar-wrap" aria-label="自動關閉進度 / Auto-close progress">
            <div class="success-bar" id="success-progress-bar"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- ── Input Area ── -->
    <footer class="chat-footer" role="contentinfo">
      <div class="input-container">
        <textarea
          id="chat-input"
          class="chat-input"
          data-i18n-placeholder="input.placeholder" placeholder="輸入訊息，或點擊上方按鈕選擇服務..."
          rows="1"
          data-i18n-aria-label="input.aria" aria-label="輸入訊息"
          maxlength="500"
        ></textarea>
        <button id="send-btn" class="send-btn" data-i18n-aria-label="send.aria" aria-label="送出訊息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <p class="footer-note" data-i18n="footer.note">本服務由 <a href="https://github.com/chinglin-k" target="_blank" rel="noopener noreferrer">@chinglin-k</a> 提供 · 僅限逢甲大學福星宿舍網路相關問題</p>
      <p class="recaptcha-disclosure" data-i18n="recaptcha.disclosure">
        本網站受 reCAPTCHA 保護，並適用 Google
        <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">隱私權政策</a>與
        <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer">服務條款</a>。
      </p>
    </footer>

  </div><!-- /#app -->

  <!-- Scripts（載入順序：config → counter → intent → report → teams → chat） -->
  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/counter.js"></script>
  <script src="js/intent.js"></script>
  <script src="js/report.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
